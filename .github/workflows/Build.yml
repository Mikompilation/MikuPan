name: Build MikuPan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  BUILD_TYPE: Release

jobs:
  shaders:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # full history + tags so the version header resolves

    - name: Set up MSYS2 (Windows)
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          git
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja

    - name: Build shaders (Windows / MinGW)
      shell: msys2 {0}
      run: |
        git config --global --add safe.directory '*'
        cmake -E remove_directory resources/shaders/dxil
        cmake -E remove_directory resources/shaders/msl
        cmake -E remove_directory resources/shaders/spirv
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DMIKUPAN_COMPILE_SHADERS=ON
        cmake --build build --target compile_shaders

    - name: Upload compiled shaders
      uses: actions/upload-artifact@v4
      with:
        name: compiled-shaders
        if-no-files-found: error
        path: |
          resources/shaders/dxil
          resources/shaders/msl
          resources/shaders/spirv

  build:
    needs: shaders
    runs-on: ${{ matrix.sys.os }}
    # Empty for Windows and macOS, which run on the host.
    container: ${{ matrix.sys.container }}
    strategy:
      fail-fast: false
      matrix:
        region:
          - { name: US, eu: "OFF" }
          - { name: EU, eu: "ON" }
        sys:
          - { os: windows-latest, name: windows }
          # Linux builds inside Valve's Steam Runtime 3 "sniper" SDK (Debian 11,
          # glibc 2.31), not on the runner: a binary needs at least the glibc it
          # was linked against, and ubuntu-latest's is newer than SteamOS's.
          # Pin the tested SDK image so local builds and CI use the same environment.
          - { os: ubuntu-latest, name: linux,
              container: 'registry.gitlab.steamos.cloud/steamrt/sniper/sdk@sha256:bb30053d3cd19d35c76ae69b2790dbaa1430448006f8240cb6d7e723f2d1940e' }
          - { os: macos-latest,   name: macos  }

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # full history + tags so the version header resolves

    - name: Download compiled shaders
      uses: actions/download-artifact@v4
      with:
        name: compiled-shaders
        path: resources/shaders

    # The codebase uses GCC-only extensions (__attribute__((mode(TI))),
    # ((optimize)), ((aligned))) plus the -static link flag, and links the
    # prebuilt MinGW FFmpeg import libs in extern/ffmpeg. It cannot build with
    # MSVC, so the Windows runner builds with MinGW via MSYS2.
    - name: Set up MSYS2 (Windows)
      if: ${{ matrix.sys.os == 'windows-latest' }}
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          git
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja

    - name: Build (Windows / MinGW)
      if: ${{ matrix.sys.os == 'windows-latest' }}
      shell: msys2 {0}
      run: |
        git config --global --add safe.directory '*'
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DMIKUPAN_COMPILE_SHADERS=OFF -DBUILD_EU_VERSION=${{ matrix.region.eu }}
        cmake --build build --target MikuPan

    # The SDK already carries CMake, Ninja and every SDL development package.
    # Its default gcc is 10; gcc-14 is the newer one it ships.
    - name: Build (Linux / Steam Runtime)
      if: ${{ matrix.sys.os == 'ubuntu-latest' }}
      shell: bash
      env:
        CC: gcc-14
        CXX: g++-14
      run: |
        git config --global --add safe.directory '*'
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DMIKUPAN_COMPILE_SHADERS=OFF -DBUILD_EU_VERSION=${{ matrix.region.eu }}
        cmake --build build --target MikuPan

    # Guard the Steam Runtime 3 floor: newer GLIBC symbols or dynamic C++
    # runtimes can prevent the binary from starting on SteamOS or older distros.
    - name: Check Linux compatibility
      if: ${{ matrix.sys.os == 'ubuntu-latest' }}
      shell: bash
      run: bash .github/scripts/check-linux-abi.sh build/MikuPan/MikuPan

    - name: Build (macOS)
      if: ${{ matrix.sys.os == 'macos-latest' }}
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DMIKUPAN_COMPILE_SHADERS=OFF -DBUILD_EU_VERSION=${{ matrix.region.eu }}
        cmake --build build --config ${{ env.BUILD_TYPE }} --target MikuPan

    - name: Zip Windows App
      if: ${{ matrix.sys.os == 'windows-latest' }}
      working-directory: build
      shell: pwsh
      run: |
        Compress-Archive -Path MikuPan/* -DestinationPath MikuPan_${{ matrix.region.name }}_${{ matrix.sys.name }}_build.zip

    - name: Zip macOS App
      if: ${{ matrix.sys.os == 'macos-latest' }}
      working-directory: build
      run: |
        zip -r MikuPan_${{ matrix.region.name }}_${{ matrix.sys.name }}_build.zip MikuPan/*

    - name: Zip Ubuntu App
      if: ${{ matrix.sys.os == 'ubuntu-latest' }}
      working-directory: build
      run: |
        zip -r MikuPan_${{ matrix.region.name }}_${{ matrix.sys.name }}_build.zip MikuPan/*

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: MikuPan-${{ matrix.region.name }}-${{ matrix.sys.name }}-build
        if-no-files-found: error
        path: build/MikuPan_${{ matrix.region.name }}_${{ matrix.sys.name }}_build.zip
